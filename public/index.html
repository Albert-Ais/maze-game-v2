<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Maze Game V3</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

/* UI */
#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    z-index: 10;
}

/* Chat */
#chatBox {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 250px;
    height: 150px;
    overflow-y: auto;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 12px;
    padding: 5px;
}

/* Leaderboard */
#board {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 180px;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 12px;
    padding: 5px;
}

/* Menu */
#menu {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    padding: 20px;
    color: white;
    text-align: center;
}
</style>

</head>
<body>

<div id="menu">
    <input id="name" placeholder="Name"><br><br>
    <input id="room" placeholder="Room"><br><br>
    <button onclick="join()">Play</button>
</div>

<div id="ui">
    Fragments: <span id="f">0</span>/10<br>
    Keys: <span id="k">0</span>/10
</div>

<div id="chatBox"></div>
<div id="board"></div>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
