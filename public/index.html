<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Maze Game V4</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial}

#menu{
position:absolute;top:40%;left:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;color:white;
}

#ui{position:absolute;top:10px;left:10px;color:white}

#chat{
position:absolute;bottom:10px;left:10px;
width:200px;height:200px;
overflow:auto;background:#111;color:white;
}
</style>
</head>

<body>

<div id="menu">
<input id="name" placeholder="Name"><br>
<input id="room" placeholder="Room"><br>
<button onclick="join()">Play</button>
</div>

<div id="ui">
Fragments: <span id="f">0</span><br>
Keys: <span id="k">0</span>
</div>

<canvas id="game"></canvas>

<div id="chat"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
